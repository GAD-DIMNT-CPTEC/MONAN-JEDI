# MONAN-JEDI — site configuration template
#
# Copy to config/<site>.yaml and change only values that describe the target
# site or desired build. Private work paths are derived automatically.
#
# Derived layout:
#   ${project.root}/work/${build.id}   private/rebuildable work
#   ${project.root}/logs/${build.id}   logs
#   ${project.root}/build/${build.id}  public runtime installation
#
# Empty optional values below mean automatic discovery or no local override.
# See docs/configuration-reference.md for types, defaults and environment
# overrides.

site: site-name

project:
  root: /path/to/user/workspace

stack:
  owner: ${USER}
  instance: stack-instance-name
  env_name: stack-environment-name
  # Relative to stack.root and owned by spack-stack.
  site_setup: configs/sites/<tier>/<site>/setup.sh
  env_module: module/name

build:
  id: monan-jedi
  jobs: 8

model:
  # Keep ON/OFF quoted so YAML does not coerce it to a boolean.
  double_precision: 'ON'

data:
  # Optional directory searched before downloading external archives.
  local_mirror_dir:
  download_missing: true

obs2ioda:
  enabled: false
  # Full 40-character commit SHA required.
  ref: 11b9e60522d63bc03b0b104a52f3dd22127fb828
  bufr_root:
  bufr_lib:
  cmake_prefix_path:
  build_type: Release
  build_goes_abi_converter: 'OFF'

wps:
  enabled: false
  # Full 40-character commit SHA required.
  ref: 335c76a111f84503e8b963abaf273ea8053645bb
  version: 4.6.0
  jasper_root:
  png_root:
  zlib_root:
  cmake_prefix_path:
  build_type: Release
  default_vtable: Vtable.GFS

compilers:
  cc: cc
  cxx: c++
  fortran: gfortran

mpi:
  cc: mpicc
  cxx: mpicxx
  fortran: mpifort

ctest:
  login_regex: "^mpasjedi_coding_norms$"
  pbs_regex: ""
  exclude_regex: ""
  jobs: 1
  allow_login_node_mpi_tests: false

pbs:
  queue: queue-name
  ncpus: 64
  walltime: "02:00:00"
  submit_job: false
