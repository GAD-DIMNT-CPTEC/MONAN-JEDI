# =============================================================================
# MONAN-JEDI site configuration template
# =============================================================================
#
# PURPOSE
# -------
# Copy this file to a site-specific name, for example config/my-site.yaml, and
# replace the example values with settings for the target machine and stack.
#
# This configuration prepares, compiles, installs and tests the MONAN-JEDI bundle
# and its auxiliary components against an existing spack-stack installation.
# It is not an operational data-assimilation experiment configuration.
#
# Normal users should describe machine paths, stack identifiers, component refs
# and runtime build choices here instead of editing scripts under scripts/.
#
# IMPORTANT FILESYSTEM MODEL
# --------------------------
# Keep these two independent areas separate:
#
#   1. project.root
#      User-owned, writable area where source checkouts, build trees, logs, cached
#      data and installation products are created.
#
#   2. stack.root, or stack.owner + stack.instance
#      Existing, validated spack-stack installation. It may be maintained by a
#      different account and may be read-only for normal MONAN-JEDI users.
#
# Do not assume that the stack is located below project.root.
#
# MAIN DERIVED PATHS
# ------------------
# When the corresponding values below are empty, the workflow derives:
#
#   work root:    ${project.root}/work/${build.id}
#   log root:     ${project.root}/logs/${build.id}
#   bundle build: ${project.root}/work/${build.id}/build
#   data cache:   ${project.root}/work/${build.id}/cache/data
#   install root: ${project.root}/builds/${build.id}
#   install bin:  ${install.root}/bin
#
# GENERAL RULES
# -------------
#   * Empty values mean "derive the documented default" unless stated otherwise.
#   * ${NAME} expressions are expanded from the process environment.
#   * A corresponding exported MONAN-JEDI environment variable overrides the YAML
#     value. This is intended for controlled one-off overrides.
#   * YAML booleans may be written as true/false.
#   * CMake values such as ON/OFF must remain quoted so YAML does not convert them
#     to booleans before they reach CMake.
#   * Paths used by scheduler jobs must be visible from compute nodes.
#   * Pin external component refs to full commit SHAs for reproducible builds.
#
# Typical use:
#   bash scripts/monan-jedi.sh <command> --config config/my-site.yaml
#
# =============================================================================

# -----------------------------------------------------------------------------
# Site identity
# -----------------------------------------------------------------------------

# Human-readable site identifier.
# Currently metadata only; workflow logic does not branch on this value.
site: site-name

# -----------------------------------------------------------------------------
# User-owned workspace and existing spack-stack
# -----------------------------------------------------------------------------

project:
  # Writable MONAN-JEDI workspace root.
  # It must be accessible from every node used by the workflow and scheduler.
  root: /path/to/user/workspace

stack:
  # Unix account or project that owns the validated spack-stack tree.
  # Use ${USER} when every user owns their own stack; use the maintainer account
  # when consuming a shared installation.
  owner: ${USER}

  # Stack instance identifier, usually the directory name created by the stack
  # installation workflow. Required when work_root/root are derived.
  instance: stack-instance-name

  # Directory containing the stack instance.
  # Empty default is JACI-specific:
  #   /p/projetos/monan_das/${stack.owner}/work/${stack.instance}
  # Non-JACI sites should normally set this explicitly.
  work_root:

  # Root of the spack-stack checkout/installation.
  # Empty default:
  #   ${stack.work_root}/spack-stack
  root:

  # Name of the concretized spack-stack environment below stack.root/envs/.
  # Required. Also used to derive stack.module_root.
  env_name: stack-environment-name

  # Directory added to MODULEPATH before loading stack.env_module.
  # Empty default:
  #   ${stack.root}/envs/${stack.env_name}/modules
  module_root:

  # Site initialization script relative to stack.root.
  # Use the site-specific setup, not the generic root setup.sh.
  # Example for JACI: configs/sites/tier2/jaci/setup.sh
  site_setup: configs/sites/<tier>/<site>/setup.sh

  # Exact environment module generated by spack-stack.
  # It should select the validated compiler, MPI and dependency set.
  env_module: module/name

# -----------------------------------------------------------------------------
# Build identity, parallelism and installation layout
# -----------------------------------------------------------------------------

build:
  # Stable identifier for this build tree and installation.
  # Required. Change it to create an independent work/log/install tree.
  # Prefer a filesystem-safe value without spaces.
  id: monan-jedi-build-name

  # Main ecbuild/CMake build directory for the MONAN-JEDI bundle.
  # The configure command removes and recreates this directory.
  # Empty default:
  #   ${project.root}/work/${build.id}/build
  dir:

  # Maximum parallel jobs used by bundle and auxiliary CMake builds.
  # This is build parallelism, not MPI process count.
  jobs: 8

install:
  # Installation prefix shared by the bundle and auxiliary tools.
  # Empty default:
  #   ${project.root}/builds/${build.id}
  root:

  # Common user-facing directory for stable executable paths.
  # Empty default:
  #   ${install.root}/bin
  bin_dir:

# -----------------------------------------------------------------------------
# MPAS build options
# -----------------------------------------------------------------------------

model:
  # MONAN/MPAS precision mode passed to ecbuild/CMake as MPAS_DOUBLE_PRECISION.
  #
  # IMPORTANT:
  #   Keep this value quoted.
  #
  # YAML may interpret unquoted ON/OFF as boolean values. Always use one of:
  #
  #   double_precision: 'ON'
  #   double_precision: 'OFF'
  #
  # Recommended values:
  #   'ON'  - validation mode. Use when running the MPAS-JEDI CTest suite.
  #           Upstream CTest reference files are produced with double precision.
  #   'OFF' - workflow mode. Use only when a target workflow or tutorial requires
  #           a single-precision MPAS build.
  #
  # Some CTest cases may fail with 'OFF' because single-precision output can
  # differ from double-precision reference files beyond the test tolerance.
  double_precision: 'ON'

# -----------------------------------------------------------------------------
# External data and offline cache
# -----------------------------------------------------------------------------

data:
  # Persistent cache for external archives required during bundle configuration.
  # Empty default:
  #   ${project.root}/work/${build.id}/cache/data
  root:

  # Optional local/offline mirror searched before network download.
  # The workflow searches the expected relative path, direct filename and a
  # recursive filename match below this directory.
  local_root:

  # Permit wget/curl downloads when an archive is absent from local_root/cache.
  # Set false on isolated systems and pre-populate the required cache instead.
  download_missing: true

  # Source URL for the CRTM coefficient archive required by the bundle.
  crtm_coeffs_url: https://bin.ssec.wisc.edu/pub/s4/CRTM/fix_REL-3.1.2.0.tgz

  # Exact cache path for the CRTM coefficient archive.
  # Empty default:
  #   ${data.root}/crtm/fix_REL-3.1.2.0.tgz
  crtm_coeffs_tgz:

# -----------------------------------------------------------------------------
# Auxiliary component: obs2ioda
# -----------------------------------------------------------------------------
#
# obs2ioda is built outside the main ecbuild bundle, but uses the same loaded
# stack and publishes its executable into the common installation bin directory.

obs2ioda:
  # Enable the explicit obs2ioda command and include it in the `all` command.
  enabled: false

  # Git repository cloned for the auxiliary build.
  repo: https://github.com/NCAR/obs2ioda.git

  # Git branch, tag or commit checked out before building.
  # Prefer a tested full commit SHA for production use.
  ref: main

  # obs2ioda source checkout.
  # Empty default:
  #   ${project.root}/work/${build.id}/obs2ioda/src
  source_dir:

  # Out-of-source CMake build directory, removed before each obs2ioda build.
  # Empty default:
  #   ${project.root}/work/${build.id}/obs2ioda/build
  build_dir:

  # Prefix passed to CMAKE_INSTALL_PREFIX for obs2ioda.
  # Empty default:
  #   ${install.root}
  install_dir:

  # Stable filename published in install.bin_dir.
  executable_name: obs2ioda_v3

  # Optional root searched for the NCEP BUFR library.
  # Empty value also tries `spack location -i bufr` and known stack paths.
  bufr_root:

  # Optional exact path to libbufr_4.so, libbufr_4.a, libbufr.so or libbufr.a.
  # When set, this takes precedence over automatic discovery and must exist.
  bufr_lib:

  # Additional semicolon-separated CMake package prefixes appended to NetCDF C,
  # Fortran and C++ prefixes detected from the loaded environment.
  cmake_prefix_path:

  # Standard CMake build type.
  # Typical values: Release, Debug, RelWithDebInfo or MinSizeRel.
  build_type: Release

  # Forwarded to the upstream BUILD_GOES_ABI_CONVERTER CMake option.
  # Keep ON/OFF quoted.
  build_goes_abi_converter: 'OFF'

# -----------------------------------------------------------------------------
# Auxiliary component: WPS / UNGRIB
# -----------------------------------------------------------------------------
#
# The current integration intentionally builds only WPS tools that do not require
# WRF: UNGRIB, g1print and g2print. geogrid and metgrid are outside this scope.
# WPS is built with its native CMake system, validated in a staging directory and
# promoted only after runtime checks pass.

wps:
  # Enable the explicit wps/test-wps commands and include WPS in `all`.
  enabled: false

  # Upstream WPS Git repository.
  repo: https://github.com/wrf-model/WPS.git

  # Exact branch, tag or commit checked out in detached mode.
  # A tested full SHA is strongly recommended.
  ref: 335c76a111f84503e8b963abaf273ea8053645bb

  # Human-readable release label used in paths and build-manifest.json.
  # Source selection is controlled exclusively by wps.ref.
  version: 4.6.0

  # WPS source checkout.
  # The workflow resets and cleans this Git tree before applying local patches.
  # Empty default:
  #   ${project.root}/work/${build.id}/wps/src
  source_dir:

  # Out-of-source CMake build directory, removed before each WPS build.
  # Empty default:
  #   ${project.root}/work/${build.id}/wps/build
  build_dir:

  # Parent directory containing versioned WPS releases.
  # Empty default:
  #   ${install.root}/wps
  releases_dir:

  # Final validated WPS release directory.
  # Stable executable and Vtable links are updated only after staging validation.
  # Empty default:
  #   ${wps.releases_dir}/WPS-${wps.version}
  install_dir:

  # Directory containing ordered *.patch compatibility patches.
  # Patches are checked, applied in filename order and recorded with SHA-256
  # hashes in build-manifest.json.
  # Empty default:
  #   <MONAN-JEDI repository>/patches/wps
  patch_dir:

  # Optional dependency installation prefixes.
  # Empty values use `spack location -i <package>` from the loaded stack.
  jasper_root:
  png_root:
  zlib_root:

  # Additional semicolon-separated CMake package prefixes appended to resolved
  # dependency roots and CMAKE_PREFIX_PATH from the loaded environment.
  cmake_prefix_path:

  # CMake build type accepted by the WPS helper.
  # Accepted values: Release, Debug, RelWithDebInfo or MinSizeRel.
  build_type: Release

  # Stable link names created in install.bin_dir after validation.
  ungrib_name: ungrib.exe
  link_grib_name: link_grib.csh

  # Variable table selected by the stable ${install.root}/share/wps/Vtable link.
  # Must be a filename only and must exist in WPS ungrib/Variable_Tables.
  default_vtable: Vtable.GFS

# -----------------------------------------------------------------------------
# Compiler and MPI wrappers
# -----------------------------------------------------------------------------

compilers:
  # Serial/compiler frontend commands resolved after loading the stack module.
  # CrayPE sites commonly use cc, CC and ftn. GNU/OpenMPI sites commonly use
  # gcc, g++ and gfortran.
  cc: cc
  cxx: c++
  fc: gfortran

  # Compatibility aliases exported for build systems expecting F77 and F90.
  f77: gfortran
  f90: gfortran

mpi:
  # MPI compiler wrappers passed explicitly to ecbuild/CMake.
  # On CrayPE, serial wrapper names may also be the MPI-aware wrappers.
  mpicc: mpicc
  mpicxx: mpicxx
  mpifc: mpifort

  # Compatibility aliases exported for build systems expecting MPIF77/MPIF90.
  mpif77: mpifort
  mpif90: mpifort

# -----------------------------------------------------------------------------
# CTest selection and scheduler safety
# -----------------------------------------------------------------------------

ctest:
  # Extended regular expression passed to `ctest -R` on a login node.
  # Keep this restricted to tests known to be safe outside compute nodes.
  login_regex: "^mpasjedi_coding_norms$"

  # Reserved PBS selection regex exported by the configuration loader.
  # The current test-pbs helper uses exclude_regex instead and does not currently
  # pass this value to `ctest -R`.
  pbs_regex: ""

  # Extended regular expression passed to `ctest -E` in the PBS job.
  # Empty string means no exclusions.
  exclude_regex: ""

  # Number of CTest tests allowed to execute concurrently.
  # This is CTest-level concurrency, not MPI ranks per individual test.
  jobs: 1

  # Reserved compatibility/safety flag.
  # Setting true does not automatically enable MPI tests on login nodes.
  allow_login_node_mpi_tests: false

# -----------------------------------------------------------------------------
# PBS resources for compute-node validation
# -----------------------------------------------------------------------------
#
# The current scheduler helper is PBS-specific. Sites using Slurm or another
# scheduler must provide a corresponding implementation before renaming this
# section or expecting these keys to affect another scheduler.

pbs:
  # PBS queue used by the test-pbs command.
  queue: queue-name

  # CPUs requested on one node through select=1:ncpus=<value>.
  ncpus: 64

  # PBS wall-clock limit in HH:MM:SS format. Size this for the complete
  # configured CTest inventory, not only for a smoke-test subset.
  walltime: "03:00:00"

  # true: generate and immediately submit with qsub.
  # false: generate the PBS script only for manual review/submission.
  submit_job: false
