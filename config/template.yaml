# =============================================================================
# MONAN-JEDI complete site configuration template
# =============================================================================
#
# PURPOSE
# -------
# This file documents every supported user-facing MONAN-JEDI configuration
# option. Copy it to config/<site>.yaml when defining another machine/site or
# when a user needs persistent overrides beyond the maintained JACI defaults.
#
# The intended rule is:
#
#   empty optional value -> derive/use the documented default
#   explicit value       -> honor the user's site/project decision
#
# The maintained config/jaci.yaml is intentionally shorter and relies on these
# defaults wherever possible. This template is therefore the authoritative
# catalog of user-configurable paths, downloads, repositories and build options.
#
# IMPORTANT FILESYSTEM MODEL
# --------------------------
# project.root owns the MONAN-JEDI workspace. The spack-stack installation is
# independent and may be shared/read-only. Most path options below may be left
# empty so config.sh derives a consistent layout, but they remain configurable
# for sites that need different filesystem placement.
#
# MAIN DERIVED PATHS
# ------------------
# With the optional path overrides below left empty, the workflow derives:
#
#   project.work_root:   ${project.root}/work/${build.id}
#   project.log_root:    ${project.root}/logs/${build.id}
#   stack.work_root:     /p/projetos/monan_das/${stack.owner}/work/${stack.instance}
#   stack.root:          ${stack.work_root}/spack-stack
#   stack.module_root:   ${stack.root}/envs/${stack.env_name}/modules
#   build.dir:           ${project.work_root}/build
#   install.root:        ${project.root}/build/${build.id}
#   install.bin_dir:     ${install.root}/bin
#   data.root:           ${project.work_root}/cache/data
#   data.crtm_coeffs_tgz:${data.root}/crtm/fix_REL-3.1.2.0.tgz
#   obs2ioda.source_dir: ${project.work_root}/obs2ioda/src
#   obs2ioda.build_dir:  ${project.work_root}/obs2ioda/build
#   obs2ioda.install_dir:${install.root}
#   wps.source_dir:      ${project.work_root}/wps/src
#   wps.build_dir:       ${project.work_root}/wps/build
#   wps.releases_dir:    ${install.root}/libexec/monan-jedi/wps
#   wps.install_dir:     ${wps.releases_dir}/WPS-${wps.version}
#   wps.patch_dir:       <MONAN-JEDI repository>/patches/wps
#
# GENERAL RULES
# -------------
#   * Empty values mean "use/derive the documented default" unless stated otherwise.
#   * ${NAME} expressions are expanded from the invoking process environment.
#   * A non-empty corresponding environment variable overrides a YAML value.
#   * YAML booleans use true/false; CMake ON/OFF strings must remain quoted.
#   * External source refs must be tested full 40-character commit SHAs.
#   * Paths used by PBS jobs must be visible from the target compute nodes.
#   * The template must keep every public schema key documented; CI enforces it.
#
# Full per-key reference: docs/configuration-reference.md
#
# Validate a copied/edited configuration with:
#   python3 scripts/lib/read_config.py --check config/<site>.yaml
#   python3 scripts/check_config_documentation.py
#
# =============================================================================

# -----------------------------------------------------------------------------
# Site identity and user-owned workspace
# -----------------------------------------------------------------------------

# Human-readable identifier for the site represented by this configuration.
# It is metadata today but gives logs/operators an explicit site identity.
site: site-name

project:
  # Writable project root from which the normal work/log/install layout is derived.
  # It must be accessible from every node that will build, test or run MONAN-JEDI.
  root: /path/to/user/workspace

  # Optional override for the private/rebuildable MONAN-JEDI work root.
  # Empty default: ${project.root}/work/${build.id}
  work_root:

  # Optional override for the directory containing MONAN-JEDI logs.
  # Empty default: ${project.root}/logs/${build.id}
  log_root:

# -----------------------------------------------------------------------------
# Existing spack-stack installation
# -----------------------------------------------------------------------------

stack:
  # Unix account that owns the stack installation consumed by this configuration.
  # When omitted in a smaller site YAML, the invoking user is used by default.
  owner: ${USER}

  # Identifier of the existing validated spack-stack instance for this site.
  # It is required because default stack paths are derived from this identifier.
  # A changed instance/path invalidates any previously identified loaded stack.
  instance: stack-instance-name

  # Optional directory containing the selected stack instance.
  # Empty default: /p/projetos/monan_das/${stack.owner}/work/${stack.instance}
  work_root:

  # Optional root of the actual spack-stack checkout/installation.
  # Empty default: ${stack.work_root}/spack-stack. If this changes, MONAN-JEDI
  # reloads the environment even when the new stack publishes the same module name.
  root:

  # Name of the concretized stack environment below stack.root/envs/.
  # This is required and participates in the default MODULEPATH derivation.
  env_name: stack-environment-name

  # Optional directory added to MODULEPATH before loading stack.env_module.
  # Empty default: ${stack.root}/envs/${stack.env_name}/modules
  module_root:

  # Site initialization script interpreted relative to stack.root.
  # The shipped default targets JACI; another site should provide its own path.
  site_setup: configs/sites/<tier>/<site>/setup.sh

  # Exact module generated by the selected stack environment and loaded by the tool.
  # It should provide the validated compiler, MPI and JEDI dependency environment.
  # Reuse requires both this name and the recorded stack/module-tree origin to match.
  env_module: module/name

# -----------------------------------------------------------------------------
# Build identity, build tree and public installation
# -----------------------------------------------------------------------------

build:
  # Stable identifier used by default work/log/install path derivations.
  # Default when omitted from a smaller site file: monan-jedi
  id: monan-jedi

  # Optional main ecbuild/CMake build directory for the MONAN-JEDI bundle.
  # Empty default: ${project.work_root}/build
  dir:

  # Maximum number of parallel jobs used for bundle/auxiliary compilation.
  # Default when omitted: 8; this is independent from PBS CPU allocation.
  jobs: 8

install:
  # Optional public installation prefix shared by the bundle and auxiliary tools.
  # Empty default: ${project.root}/build/${build.id}
  root:

  # Optional stable user-facing executable directory used by downstream workflows.
  # Empty default: ${install.root}/bin.
  # Optional secondary alias directory; canonical consumer executables remain
  # under ${install.root}/bin even when this is overridden.
  bin_dir:

# -----------------------------------------------------------------------------
# MPAS build options
# -----------------------------------------------------------------------------

model:
  # MONAN/MPAS precision mode forwarded as MPAS_DOUBLE_PRECISION.
  # Default is 'ON'; keep ON/OFF quoted so YAML preserves them as strings.
  double_precision: 'ON'

# -----------------------------------------------------------------------------
# External data, mirrors and CRTM archive
# -----------------------------------------------------------------------------

data:
  # Optional persistent cache root for external archives used during configuration.
  # Empty default: ${project.work_root}/cache/data
  root:

  # Optional local/offline mirror searched before network download.
  # Empty means no extra mirror; cache lookup and normal download policy still apply.
  local_mirror_dir:

  # Permit downloading required archives when mirror/cache lookup cannot satisfy them.
  # Default is true; set false on isolated systems after pre-staging required files.
  download_missing: true

  # Source URL used when the CRTM coefficient archive must be downloaded.
  # Default points to the currently validated SSEC CRTM 3.1.2.0 coefficient archive.
  crtm_coeffs_url: https://bin.ssec.wisc.edu/pub/s4/CRTM/fix_REL-3.1.2.0.tgz

  # Optional exact local cache path for the CRTM coefficient archive.
  # Empty default: ${data.root}/crtm/fix_REL-3.1.2.0.tgz
  crtm_coeffs_tgz:

# -----------------------------------------------------------------------------
# Auxiliary component: obs2ioda
# -----------------------------------------------------------------------------

obs2ioda:
  # Enable building/publishing obs2ioda and include it in aggregate operations.
  # Default is false so generic/new sites opt in deliberately.
  enabled: false

  # Upstream Git repository cloned for the standalone obs2ioda build.
  # Default is the NCAR/obs2ioda repository; mirrors/forks may be set explicitly.
  repo: https://github.com/NCAR/obs2ioda.git

  # Exact tested upstream source revision used for reproducible builds.
  # A full 40-character SHA is required; moving branches such as main are rejected.
  ref: 11b9e60522d63bc03b0b104a52f3dd22127fb828

  # Optional obs2ioda source checkout directory.
  # Empty default: ${project.work_root}/obs2ioda/src
  source_dir:

  # Optional out-of-source CMake build directory, normally disposable/rebuildable.
  # Empty default: ${project.work_root}/obs2ioda/build
  build_dir:

  # Optional CMAKE_INSTALL_PREFIX used for the obs2ioda installation.
  # Empty default: ${install.root}
  install_dir:

  # Optional secondary converter alias name published in install.bin_dir.
  # Default: obs2ioda_v3; changing it affects the published user-facing name.
  executable_name: obs2ioda_v3

  # Optional root searched for the NCEP BUFR dependency before automatic discovery.
  # Empty lets the helper inspect the loaded stack and known stack locations.
  bufr_root:

  # Optional exact BUFR library path, taking precedence over root/automatic discovery.
  # Empty keeps discovery automatic; a supplied path must exist and be compatible.
  bufr_lib:

  # Extra semicolon-separated CMake package prefixes for obs2ioda dependency lookup.
  # Empty is preferred when the active stack already exposes all required packages.
  cmake_prefix_path:

  # Standard CMake build type for the auxiliary obs2ioda build.
  # Default Release; allowed values: Release, Debug, RelWithDebInfo, MinSizeRel.
  build_type: Release

  # Forwarded to the upstream optional GOES ABI converter CMake switch.
  # Default 'OFF'; keep ON/OFF quoted so YAML does not convert them to booleans.
  build_goes_abi_converter: 'OFF'

# -----------------------------------------------------------------------------
# Auxiliary component: WPS / UNGRIB
# -----------------------------------------------------------------------------

wps:
  # Enable building/publishing the supported WPS/UNGRIB tools.
  # Default is false so a generic/new site opts in deliberately.
  enabled: false

  # Upstream Git repository cloned for the WPS integration.
  # Default is wrf-model/WPS; a validated mirror or fork may be supplied explicitly.
  repo: https://github.com/wrf-model/WPS.git

  # Exact tested WPS source revision against which compatibility patches are checked.
  # A full 40-character SHA is required for reproducible builds.
  ref: 335c76a111f84503e8b963abaf273ea8053645bb

  # Human-readable WPS release label recorded in paths and build metadata.
  # Default 4.6.0; source selection is controlled by wps.ref, not this label.
  version: 4.6.0

  # Optional WPS source checkout directory used for the validated upstream tree.
  # Empty default: ${project.work_root}/wps/src; override for development trees or site-specific storage.
  source_dir:

  # Optional WPS out-of-source CMake build directory.
  # Empty default: ${project.work_root}/wps/build
  build_dir:

  # Optional parent directory for validated/versioned WPS releases.
  # Empty default: ${install.root}/libexec/monan-jedi/wps
  releases_dir:

  # Optional final validated WPS release directory.
  # Empty default: ${wps.releases_dir}/WPS-${wps.version}
  install_dir:

  # Optional directory containing ordered local compatibility *.patch files.
  # Empty default: <MONAN-JEDI repository>/patches/wps
  patch_dir:

  # Optional JasPer installation prefix before automatic spack-stack discovery.
  # Empty keeps dependency resolution anchored in the active stack environment.
  jasper_root:

  # Optional libpng installation prefix before automatic stack discovery.
  # Empty keeps dependency resolution anchored in the active stack environment.
  png_root:

  # Optional zlib installation prefix before automatic stack discovery.
  # Empty keeps dependency resolution anchored in the active stack environment.
  zlib_root:

  # Additional semicolon-separated CMake package prefixes for WPS dependency lookup.
  # Empty is recommended unless a site intentionally supplies packages elsewhere.
  cmake_prefix_path:

  # Standard CMake build type for the supported WPS helper build.
  # Default Release; allowed values: Release, Debug, RelWithDebInfo, MinSizeRel.
  build_type: Release

  # Optional secondary UNGRIB alias name published in install.bin_dir after validation.
  # Default: ungrib.exe; change only when a site/workflow requires another public name.
  ungrib_name: ungrib.exe

  # Optional secondary link_grib alias name published in install.bin_dir after validation.
  # Default: link_grib.csh; change only when a site requires another public name.
  link_grib_name: link_grib.csh

  # Variable table selected by the stable install share/wps/Vtable interface.
  # Default Vtable.GFS; it must be a filename available in WPS Variable_Tables.
  default_vtable: Vtable.GFS

# -----------------------------------------------------------------------------
# Compiler and MPI wrappers
# -----------------------------------------------------------------------------

compilers:
  # C compiler command used after stack activation.
  # Default is cc; sites may explicitly select another compatible compiler/wrapper.
  cc: cc

  # C++ compiler command used after stack activation.
  # Default is CC; sites should override when their toolchain uses another wrapper.
  cxx: CC

  # Canonical Fortran compiler command used to derive FC/F77/F90 compatibility aliases.
  # Default is ftn; one YAML value avoids maintaining three duplicate compiler settings.
  fortran: ftn

mpi:
  # MPI-aware C compiler wrapper used when components request it explicitly.
  # Default is cc; sites with separate MPI wrappers may set mpicc or an equivalent.
  cc: cc

  # MPI-aware C++ wrapper used when components request it explicitly.
  # Default is CC; sites with separate MPI wrappers may set mpicxx or equivalent.
  cxx: CC

  # Canonical MPI Fortran wrapper used to derive MPIFC/MPIF77/MPIF90 aliases.
  # Default is ftn; sites may set mpifort or another stack-compatible wrapper.
  fortran: ftn

# -----------------------------------------------------------------------------
# CTest selection and safety
# -----------------------------------------------------------------------------

ctest:
  # Extended regular expression passed to ctest -R for login-node-safe validation.
  # Default selects only mpasjedi_coding_norms; broaden only with site-policy support.
  login_regex: "^mpasjedi_coding_norms$"

  # Optional inclusion regex reserved for PBS-side CTest selection.
  # Default empty means the current PBS helper does not apply an additional -R filter.
  pbs_regex: ""

  # Extended regular expression passed to ctest -E to omit selected compute-node tests.
  # Default empty excludes nothing; maintained sites may record understood exclusions.
  exclude_regex: ""

  # Maximum number of CTest cases run concurrently by the test driver.
  # Default 1; this controls test-level concurrency, not MPI ranks inside a test.
  jobs: 1

  # Explicit safety flag related to MPI tests on login nodes.
  # Default false; enabling it should reflect a deliberate supported site policy.
  allow_login_node_mpi_tests: false

# -----------------------------------------------------------------------------
# PBS resources for compute-node validation
# -----------------------------------------------------------------------------

pbs:
  # PBS queue selected when preparing/submitting the compute-node validation job.
  # Default pesqmidi reflects the current project default and may be overridden per site.
  queue: pesqmidi

  # CPUs requested from PBS for the validation allocation.
  # Default 64; this scheduler resource is independent from build.jobs.
  ncpus: 64

  # PBS wall-clock request in HH:MM:SS format.
  # Default 02:00:00; choose a value appropriate for the validated site test suite.
  walltime: "02:00:00"

  # Submit the generated PBS job immediately instead of only preparing it.
  # Default false so generic/new sites cannot accidentally submit scheduler work.
  submit_job: false
