# =============================================================================
# MONAN-JEDI site configuration template
# =============================================================================
#
# Copy to config/<site>.yaml and adapt the machine/stack values.
#
# Filesystem model:
#   ${project.root}/work/${build.id}   private work/build trees
#   ${project.root}/logs/${build.id}   logs
#   ${project.root}/build/${build.id}  public runtime installation
#
# Downstream workflows should receive only MONAN_JEDI_INSTALL_ROOT and must not
# depend on source or build-tree paths.
# =============================================================================

site: site-name

project:
  root: /path/to/user/workspace

stack:
  owner: ${USER}
  instance: stack-instance-name
  work_root:
  root:
  env_name: stack-environment-name
  module_root:
  site_setup: configs/sites/<tier>/<site>/setup.sh
  env_module: module/name

build:
  id: monan-jedi-build-name
  dir:
  jobs: 8

install:
  # Empty default: ${project.root}/build/${build.id}
  root:
  bin_dir:

model:
  double_precision: 'ON'

data:
  root:
  local_root:
  download_missing: true
  crtm_coeffs_url: https://bin.ssec.wisc.edu/pub/s4/CRTM/fix_REL-3.1.2.0.tgz
  crtm_coeffs_tgz:

obs2ioda:
  enabled: false
  repo: https://github.com/NCAR/obs2ioda.git
  ref: main
  source_dir:
  build_dir:
  install_dir:
  executable_name: obs2ioda_v3
  bufr_root:
  bufr_lib:
  cmake_prefix_path:
  build_type: Release
  build_goes_abi_converter: 'OFF'

wps:
  enabled: false
  repo: https://github.com/wrf-model/WPS.git
  ref: 335c76a111f84503e8b963abaf273ea8053645bb
  version: 4.6.0
  source_dir:
  build_dir:
  # Empty default: ${install.root}/libexec/monan-jedi/wps
  releases_dir:
  install_dir:
  patch_dir:
  jasper_root:
  png_root:
  zlib_root:
  cmake_prefix_path:
  build_type: Release
  ungrib_name: ungrib.exe
  link_grib_name: link_grib.csh
  default_vtable: Vtable.GFS

compilers:
  cc: cc
  cxx: c++
  fc: gfortran
  f77: gfortran
  f90: gfortran

mpi:
  mpicc: mpicc
  mpicxx: mpicxx
  mpifc: mpifort
  mpif77: mpifort
  mpif90: mpifort

ctest:
  login_regex: "^mpasjedi_coding_norms$"
  pbs_regex: ""
  exclude_regex: ""
  jobs: 1
  allow_login_node_mpi_tests: false

pbs:
  queue: queue-name
  ncpus: 64
  walltime: "02:00:00"
  submit_job: false
