# Generic MONAN-JEDI site configuration template.
#
# Copy this file to a site-specific name and replace the example values.
# Workflow logic belongs in scripts/, while machine paths, stack identifiers,
# component revisions and runtime choices belong in this YAML file.
#
# General rules:
#   * Empty values mean "derive the documented default" unless stated otherwise.
#   * ${NAME} expressions are expanded from the process environment.
#   * An already exported MONAN-JEDI environment variable overrides the YAML
#     value mapped to it. This is useful for one-off runs without editing files.
#   * YAML booleans may be written as true/false.
#   * CMake values such as ON/OFF must remain quoted so YAML does not convert
#     them to booleans.
#   * Paths used by scheduler jobs must be visible from compute nodes.

# Human-readable site identifier.
# This is currently metadata only; scripts do not branch on this value.
site: site-name

project:
  # Writable root used to derive work, log, cache and installation paths.
  # Environment variables are expanded.
  root: /path/to/user/workspace

stack:
  # Account or project owner of the shared spack-stack installation.
  # It may differ from the user running MONAN-JEDI.
  owner: ${USER}

  # Name of the stack installation directory.
  # Required. Used in the default stack.work_root path.
  instance: stack-instance-name

  # Directory containing the stack instance.
  # Empty default:
  #   /p/projetos/monan_das/${stack.owner}/work/${stack.instance}
  # Non-JACI sites should normally set this explicitly.
  work_root:

  # Root of the spack-stack source/installation tree.
  # Empty default:
  #   ${stack.work_root}/spack-stack
  root:

  # Name of the concretized spack-stack environment below stack.root/envs/.
  # Required. Also used to derive stack.module_root.
  env_name: stack-environment-name

  # Directory added to MODULEPATH before loading stack.env_module.
  # Empty default:
  #   ${stack.root}/envs/${stack.env_name}/modules
  module_root:

  # Site initialization script, relative to stack.root.
  # Replace <tier>/<site> with the stack's actual site configuration.
  site_setup: configs/sites/<tier>/<site>/setup.sh

  # Exact environment module generated by spack-stack.
  env_module: module/name

build:
  # Stable run/build identifier.
  # Required. Used to name derived work, log and installation directories.
  # Prefer a filesystem-safe name without spaces.
  id: monan-jedi-build-name

  # Main ecbuild/CMake build directory for the MONAN-JEDI bundle.
  # The directory is recreated by the configure command.
  # Empty default:
  #   ${project.root}/work/${build.id}/build
  dir:

  # Maximum parallel build jobs used by the bundle and auxiliary CMake builds.
  jobs: 8

install:
  # Installation prefix shared by the bundle and auxiliary components.
  # Empty default:
  #   ${project.root}/builds/${build.id}
  root:

  # User-facing directory for stable executable paths.
  # Empty default:
  #   ${install.root}/bin
  bin_dir:

model:
  # Build MPAS with double precision.
  # Accepted values: 'ON' or 'OFF'.
  # Keep the value quoted. 'ON' is recommended for comparison with upstream
  # CTest reference data; 'OFF' is intended only for workflows requiring it.
  double_precision: 'ON'

data:
  # Persistent cache for external archives used during configuration.
  # Empty default:
  #   ${project.root}/work/${build.id}/cache/data
  root:

  # Optional local/offline data mirror searched before downloading.
  # The workflow searches both the expected relative path and matching
  # filenames below this directory.
  local_root:

  # Permit wget/curl downloads when an archive is absent from local_root/cache.
  download_missing: true

  # Source URL for the CRTM coefficient archive required by the bundle.
  crtm_coeffs_url: https://bin.ssec.wisc.edu/pub/s4/CRTM/fix_REL-3.1.2.0.tgz

  # Exact cache path for the CRTM archive.
  # Empty default:
  #   ${data.root}/crtm/fix_REL-3.1.2.0.tgz
  crtm_coeffs_tgz:

obs2ioda:
  # Include obs2ioda when running the obs2ioda command or complete workflow.
  enabled: false

  # Git repository cloned for the auxiliary obs2ioda build.
  repo: https://github.com/NCAR/obs2ioda.git

  # Git branch, tag or commit checked out before building.
  # Prefer a full commit SHA for reproducible production builds.
  ref: main

  # obs2ioda source checkout.
  # Empty default:
  #   ${project.root}/work/${build.id}/obs2ioda/src
  source_dir:

  # Out-of-source CMake build directory; removed before each obs2ioda build.
  # Empty default:
  #   ${project.root}/work/${build.id}/obs2ioda/build
  build_dir:

  # Prefix passed to CMAKE_INSTALL_PREFIX for obs2ioda.
  # Empty default:
  #   ${install.root}
  install_dir:

  # Stable filename published in install.bin_dir.
  executable_name: obs2ioda_v3

  # Optional root directory used while searching for the NCEP BUFR library.
  # Leave empty to try `spack location -i bufr` and known stack install paths.
  bufr_root:

  # Optional exact path to a supported NCEP BUFR library.
  # When set, this takes precedence over automatic discovery and must exist.
  bufr_lib:

  # Additional semicolon-separated CMake package prefixes appended to NetCDF
  # prefixes detected through nc-config, nf-config and ncxx4-config.
  cmake_prefix_path:

  # Standard CMake build type, normally Release, Debug, RelWithDebInfo or
  # MinSizeRel.
  build_type: Release

  # Forwarded to the obs2ioda BUILD_GOES_ABI_CONVERTER CMake option.
  # Keep ON/OFF quoted.
  build_goes_abi_converter: 'OFF'

wps:
  # Include standalone WPS tools in the wps command and complete workflow.
  # The current integration builds UNGRIB, g1print and g2print only.
  enabled: false

  # Upstream WPS Git repository.
  repo: https://github.com/wrf-model/WPS.git

  # Branch, tag or commit checked out in detached mode.
  # A pinned full SHA is strongly recommended.
  ref: 335c76a111f84503e8b963abaf273ea8053645bb

  # Human-readable release label used in paths and the build manifest.
  # Source selection is controlled by wps.ref.
  version: 4.6.0

  # WPS source checkout. The workflow resets and cleans this Git tree.
  # Empty default:
  #   ${project.root}/work/${build.id}/wps/src
  source_dir:

  # Out-of-source CMake build directory; removed before each WPS build.
  # Empty default:
  #   ${project.root}/work/${build.id}/wps/build
  build_dir:

  # Parent directory containing versioned WPS releases.
  # Empty default:
  #   ${install.root}/wps
  releases_dir:

  # Final validated release directory.
  # Stable links are changed only after staging validation succeeds.
  # Empty default:
  #   ${wps.releases_dir}/WPS-${wps.version}
  install_dir:

  # Directory containing ordered *.patch compatibility patches.
  # Empty default:
  #   <MONAN-JEDI repository>/patches/wps
  patch_dir:

  # Optional dependency prefixes.
  # Empty values use `spack location -i <package>` from the loaded stack.
  jasper_root:
  png_root:
  zlib_root:

  # Additional semicolon-separated prefixes appended to resolved dependencies
  # and the environment CMAKE_PREFIX_PATH.
  cmake_prefix_path:

  # Accepted values: Release, Debug, RelWithDebInfo or MinSizeRel.
  build_type: Release

  # Stable link names created in install.bin_dir after validation.
  ungrib_name: ungrib.exe
  link_grib_name: link_grib.csh

  # Filename selected by the stable ${install.root}/share/wps/Vtable link.
  # It must exist in WPS ungrib/Variable_Tables and cannot contain a path.
  default_vtable: Vtable.GFS

compilers:
  # Serial/compiler frontend commands resolved after loading the stack module.
  # Replace these examples with the site's wrappers when needed.
  cc: cc
  cxx: c++
  fc: gfortran

  # Compatibility aliases exported as F77 and F90.
  f77: gfortran
  f90: gfortran

mpi:
  # MPI compiler wrappers passed explicitly to ecbuild/CMake.
  mpicc: mpicc
  mpicxx: mpicxx
  mpifc: mpifort

  # Compatibility aliases exported as MPIF77 and MPIF90.
  mpif77: mpifort
  mpif90: mpifort

ctest:
  # Extended regular expression passed to `ctest -R` on a login node.
  # Keep it restricted to tests known to be safe outside compute nodes.
  login_regex: "^mpasjedi_coding_norms$"

  # Reserved PBS selection regex exported by the configuration loader.
  # The current test-pbs helper uses exclude_regex instead.
  pbs_regex: ""

  # Extended regular expression passed to `ctest -E` in the PBS job.
  # Empty string means no exclusions.
  exclude_regex: ""

  # Number of CTest tests allowed to execute concurrently.
  jobs: 1

  # Compatibility/reserved safety flag.
  # It currently does not broaden the login-node test selection.
  allow_login_node_mpi_tests: false

pbs:
  # Scheduler queue used by test-pbs.
  queue: queue-name

  # CPUs requested on one node: select=1:ncpus=<value>.
  ncpus: 64

  # Wall-clock limit in HH:MM:SS format.
  walltime: "00:30:00"

  # true submits immediately with qsub; false only generates the PBS script.
  submit_job: false
