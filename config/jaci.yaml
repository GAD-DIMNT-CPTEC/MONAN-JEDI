# MONAN-JEDI site configuration for JACI.
# User-editable values belong here; workflow scripts should not need local edits.

site: jaci

project:
  root: /p/projetos/monan_das/${USER}

stack:
  owner: joao.gerd
  instance: spack-stack-inpe-overlay-20260515T181917Z
  work_root:
  root:
  env_name: jaci-mpas-jedi-gcc12-craympich
  module_root:
  site_setup: configs/sites/tier2/jaci/setup.sh
  env_module: cray-mpich/8.1.31/none/none/jedi-mpas-env/1.0.0

build:
  id: monan-jedi
  dir:
  jobs: 64

install:
  root:
  bin_dir:

model:
  # Keep ON/OFF quoted because YAML may otherwise convert them to booleans.
  double_precision: 'ON'

data:
  root:
  local_root:
  download_missing: true
  crtm_coeffs_url: https://bin.ssec.wisc.edu/pub/s4/CRTM/fix_REL-3.1.2.0.tgz
  crtm_coeffs_tgz:

obs2ioda:
  enabled: true
  repo: https://github.com/NCAR/obs2ioda.git
  ref: main
  source_dir:
  build_dir:
  install_dir:
  executable_name: obs2ioda_v3
  bufr_root:
  bufr_lib:
  cmake_prefix_path:
  build_type: Release
  build_goes_abi_converter: 'OFF'

wps:
  # Build only the WPS components that do not require WRF, primarily UNGRIB.
  enabled: true
  repo: https://github.com/wrf-model/WPS.git
  ref: 335c76a111f84503e8b963abaf273ea8053645bb
  version: 4.6.0
  source_dir:
  build_dir:
  releases_dir:
  install_dir:
  patch_dir:
  jasper_root:
  png_root:
  zlib_root:
  cmake_prefix_path:
  build_type: Release
  ungrib_name: ungrib.exe
  link_grib_name: link_grib.csh
  default_vtable: Vtable.GFS

compilers:
  cc: cc
  cxx: CC
  fc: ftn
  f77: ftn
  f90: ftn

mpi:
  mpicc: cc
  mpicxx: CC
  mpifc: ftn
  mpif77: ftn
  mpif90: ftn

ctest:
  login_regex: "^mpasjedi_coding_norms$"
  pbs_regex: ""
  exclude_regex: "^(ioda_bufr_python_encoder|ioda_bufr_python_parallel|mpasjedi_lgetkf_height_vloc)$"
  jobs: 1
  allow_login_node_mpi_tests: false

pbs:
  queue: pesqmini
  ncpus: 64
  walltime: "00:30:00"
  submit_job: true
