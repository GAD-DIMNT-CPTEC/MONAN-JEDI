# MONAN-JEDI configuration for the JACI supercomputer.
#
# This file is the user-facing source of truth for site-specific settings.
# Workflow logic belongs in scripts/, while paths, component revisions and
# runtime choices belong here.
#
# General rules:
#   * Empty values mean "derive the documented default" unless stated otherwise.
#   * ${NAME} expressions are expanded from the process environment.
#   * An already exported MONAN-JEDI environment variable overrides the YAML
#     value mapped to it. This is useful for one-off runs without editing files.
#   * YAML booleans may be written as true/false.
#   * CMake values such as ON/OFF must remain quoted so YAML does not convert
#     them to booleans.
#   * Paths used by PBS jobs must be visible from JACI compute nodes, normally
#     below /p or /lustre.

# Human-readable site identifier.
# This is currently metadata only; scripts do not branch on this value.
site: jaci

project:
  # Writable project root used to derive work, log, cache and installation paths.
  # Environment variables are expanded. On JACI this directory must be on a
  # shared filesystem accessible from login and compute nodes.
  root: /p/projetos/monan_das/${USER}

stack:
  # Account that owns the shared spack-stack installation.
  # It may differ from the user running MONAN-JEDI.
  owner: joao.gerd

  # Name of the stack installation directory.
  # Required. Used in the default stack.work_root path.
  instance: spack-stack-inpe-overlay-20260515T181917Z

  # Directory containing the stack instance.
  # Empty default:
  #   /p/projetos/monan_das/${stack.owner}/work/${stack.instance}
  work_root:

  # Root of the spack-stack source/installation tree.
  # Empty default:
  #   ${stack.work_root}/spack-stack
  root:

  # Name of the concretized spack-stack environment below stack.root/envs/.
  # Required. Also used to derive stack.module_root.
  env_name: jaci-mpas-jedi-gcc12-craympich

  # Directory added to MODULEPATH before loading stack.env_module.
  # Empty default:
  #   ${stack.root}/envs/${stack.env_name}/modules
  module_root:

  # Site initialization script, relative to stack.root.
  # It configures the JACI compiler/MPI environment before module loading.
  site_setup: configs/sites/tier2/jaci/setup.sh

  # Exact environment module generated by spack-stack and loaded by the workflow.
  # The complete module name is site- and compiler-specific.
  env_module: cray-mpich/8.1.31/none/none/jedi-mpas-env/1.0.0

build:
  # Stable run/build identifier.
  # Required. Used to name derived work, log and installation directories.
  # Prefer a filesystem-safe name without spaces.
  id: monan-jedi

  # Main ecbuild/CMake build directory for the MONAN-JEDI bundle.
  # The directory is recreated by the configure command.
  # Empty default:
  #   ${project.root}/work/${build.id}/build
  dir:

  # Maximum parallel build jobs used by the bundle and auxiliary CMake builds.
  # Choose a value compatible with the resources available on the current node.
  jobs: 64

install:
  # Installation prefix shared by the bundle and auxiliary components.
  # Empty default:
  #   ${project.root}/builds/${build.id}
  root:

  # User-facing directory for stable executable paths.
  # Empty default:
  #   ${install.root}/bin
  bin_dir:

model:
  # Build MPAS with double precision.
  # Accepted values: 'ON' or 'OFF'.
  # Keep the value quoted. 'ON' is recommended for comparison with upstream
  # CTest reference data; 'OFF' is intended only for workflows requiring it.
  double_precision: 'ON'

data:
  # Persistent cache for external archives used during configuration.
  # Empty default:
  #   ${project.root}/work/${build.id}/cache/data
  root:

  # Optional local/offline data mirror searched before downloading.
  # The workflow searches both the expected relative path and matching
  # filenames below this directory. Leave empty when no mirror is available.
  local_root:

  # Permit wget/curl downloads when an archive is absent from local_root/cache.
  # Set false on isolated systems and pre-populate the required cache instead.
  download_missing: true

  # Source URL for the CRTM coefficient archive required by the bundle.
  crtm_coeffs_url: https://bin.ssec.wisc.edu/pub/s4/CRTM/fix_REL-3.1.2.0.tgz

  # Exact cache path for the CRTM archive.
  # Empty default:
  #   ${data.root}/crtm/fix_REL-3.1.2.0.tgz
  crtm_coeffs_tgz:

obs2ioda:
  # Include obs2ioda when running the obs2ioda command or the complete workflow.
  enabled: true

  # Git repository cloned for the auxiliary obs2ioda build.
  repo: https://github.com/NCAR/obs2ioda.git

  # Git branch, tag or commit checked out before building.
  # A full commit SHA is recommended for fully reproducible production builds.
  ref: main

  # obs2ioda source checkout.
  # Empty default:
  #   ${project.root}/work/${build.id}/obs2ioda/src
  source_dir:

  # Out-of-source CMake build directory; removed before each obs2ioda build.
  # Empty default:
  #   ${project.root}/work/${build.id}/obs2ioda/build
  build_dir:

  # Prefix passed to CMAKE_INSTALL_PREFIX for obs2ioda.
  # Empty default:
  #   ${install.root}
  install_dir:

  # Stable filename published in install.bin_dir.
  # This does not rename the upstream build target before publication.
  executable_name: obs2ioda_v3

  # Optional root directory used while searching for the NCEP BUFR library.
  # Leave empty to try `spack location -i bufr` and known stack install paths.
  bufr_root:

  # Optional exact path to libbufr_4.so, libbufr_4.a, libbufr.so or libbufr.a.
  # When set, this takes precedence over automatic discovery and must exist.
  bufr_lib:

  # Additional semicolon-separated CMake package prefixes.
  # These are appended to NetCDF C, Fortran and C++ prefixes detected through
  # nc-config, nf-config and ncxx4-config.
  cmake_prefix_path:

  # Standard CMake build type, normally Release, Debug, RelWithDebInfo or
  # MinSizeRel. Release is recommended for operational converters.
  build_type: Release

  # Forwarded to the obs2ioda BUILD_GOES_ABI_CONVERTER CMake option.
  # Keep ON/OFF quoted. OFF avoids building the optional GOES ABI converter.
  build_goes_abi_converter: 'OFF'

wps:
  # Include the standalone WPS tools in the wps command and complete workflow.
  # This integration intentionally builds UNGRIB, g1print and g2print only;
  # geogrid/metgrid require WRF and are outside the current scope.
  enabled: true

  # Upstream WPS Git repository.
  repo: https://github.com/wrf-model/WPS.git

  # Exact branch, tag or commit checked out in detached mode.
  # The pinned full SHA below is the tested WPS 4.6.0 integration revision.
  ref: 335c76a111f84503e8b963abaf273ea8053645bb

  # Human-readable release label used in installation paths and the manifest.
  # This does not select source code; wps.ref is authoritative.
  version: 4.6.0

  # WPS source checkout. The workflow resets and cleans this Git tree.
  # Empty default:
  #   ${project.root}/work/${build.id}/wps/src
  source_dir:

  # Out-of-source CMake build directory; removed before each WPS build.
  # Empty default:
  #   ${project.root}/work/${build.id}/wps/build
  build_dir:

  # Parent directory containing versioned WPS releases.
  # Empty default:
  #   ${install.root}/wps
  releases_dir:

  # Final validated release directory.
  # A staging sibling is built and validated first; stable links are changed
  # only after successful promotion.
  # Empty default:
  #   ${wps.releases_dir}/WPS-${wps.version}
  install_dir:

  # Directory containing ordered *.patch compatibility patches.
  # Patches are checked with `git apply --check`, applied in filename order and
  # recorded with SHA-256 hashes in build-manifest.json.
  # Empty default:
  #   <MONAN-JEDI repository>/patches/wps
  patch_dir:

  # Optional JasPer installation prefix.
  # Empty value uses `spack location -i jasper` from the loaded stack.
  jasper_root:

  # Optional libpng installation prefix.
  # Empty value uses `spack location -i libpng` from the loaded stack.
  png_root:

  # Optional zlib installation prefix.
  # Empty value uses `spack location -i zlib` from the loaded stack.
  zlib_root:

  # Additional semicolon-separated prefixes appended to the automatically
  # resolved JasPer/libpng/zlib roots and the environment CMAKE_PREFIX_PATH.
  cmake_prefix_path:

  # CMake build type accepted by the WPS helper:
  # Release, Debug, RelWithDebInfo or MinSizeRel.
  build_type: Release

  # Stable UNGRIB link name created in install.bin_dir after validation.
  ungrib_name: ungrib.exe

  # Stable link_grib helper name created in install.bin_dir after validation.
  link_grib_name: link_grib.csh

  # Variable table selected by the stable ${install.root}/share/wps/Vtable link.
  # Must be a filename only and must exist in WPS ungrib/Variable_Tables.
  default_vtable: Vtable.GFS

compilers:
  # C compiler command resolved after the stack module is loaded.
  # On Cray systems, cc is the compiler wrapper.
  cc: cc

  # C++ compiler command. CC is the Cray C++ wrapper and is case-sensitive.
  cxx: CC

  # Primary Fortran compiler command.
  fc: ftn

  # Compatibility aliases exported for build systems expecting F77/F90.
  f77: ftn
  f90: ftn

mpi:
  # MPI compiler wrappers passed explicitly to ecbuild/CMake.
  # JACI's Cray wrappers are MPI-aware after the environment module is loaded.
  mpicc: cc
  mpicxx: CC
  mpifc: ftn

  # Compatibility aliases for build systems expecting MPIF77/MPIF90.
  mpif77: ftn
  mpif90: ftn

ctest:
  # Extended regular expression passed to `ctest -R` by the login-node test.
  # Keep this restricted to tests known to be safe without compute-node MPI.
  login_regex: "^mpasjedi_coding_norms$"

  # Reserved PBS selection regex exported by the configuration loader.
  # The current test-pbs helper runs the full suite and uses exclude_regex
  # instead, so leave this empty unless the helper is extended to consume it.
  pbs_regex: ""

  # Extended regular expression passed to `ctest -E` in the PBS job.
  # Use an empty string to exclude nothing.
  exclude_regex: "^(ioda_bufr_python_encoder|ioda_bufr_python_parallel|mpasjedi_lgetkf_height_vloc)$"

  # Number of CTest tests allowed to execute concurrently.
  # This is CTest-level concurrency, not the number of MPI ranks per test.
  jobs: 1

  # Compatibility/reserved safety flag.
  # The current login test remains restricted by login_regex regardless of this
  # value; setting true does not automatically enable MPI tests on login nodes.
  allow_login_node_mpi_tests: false

pbs:
  # PBS queue used by the test-pbs command.
  queue: pesqmini

  # CPUs requested on one node: select=1:ncpus=<value>.
  ncpus: 64

  # PBS wall-clock limit in HH:MM:SS format.
  walltime: "00:30:00"

  # true: generate and immediately submit the PBS script with qsub.
  # false: generate the script and logs only, allowing manual review/submission.
  submit_job: true
