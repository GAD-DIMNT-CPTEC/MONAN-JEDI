# =============================================================================
# MONAN-JEDI site configuration for JACI
# =============================================================================
#
# PURPOSE
# -------
# This is the user-editable configuration entry point for preparing, compiling,
# installing and testing the MONAN-JEDI bundle and its auxiliary components on
# JACI. Normal users should change this file instead of editing workflow scripts.
#
# This is not an operational data-assimilation experiment configuration. It does
# not describe cycles, observations, backgrounds or MPAS-JEDI application YAMLs.
# Runtime experiment settings belong in the workflow/experiment repository or in
# examples/ when they are maintained only as usage examples.
#
# IMPORTANT FILESYSTEM MODEL
# --------------------------
# The workflow deliberately separates two independent filesystem areas:
#
#   1. project.root
#      User-owned, writable area where MONAN-JEDI derives work trees, build
#      trees, logs, cached data and the public installation.
#
#   2. stack.owner + stack.instance
#      Existing, validated spack-stack installation. It may be maintained by a
#      different account and may be read-only for the user running MONAN-JEDI.
#
# Do not assume that the stack is located below project.root. A user may build
# in their own project area while consuming a shared stack owned by another
# account.
#
# MAIN DERIVED PATHS
# ------------------
# Private/internal paths were intentionally removed from the public YAML
# interface. The workflow derives them from project.root and build.id:
#
#   work root:       ${project.root}/work/${build.id}
#   log root:        ${project.root}/logs/${build.id}
#   bundle build:    ${project.root}/work/${build.id}/build
#   data cache:      ${project.root}/work/${build.id}/cache/data
#   install root:    ${project.root}/build/${build.id}
#   install bin:     ${project.root}/build/${build.id}/bin
#   obs2ioda source: ${work root}/obs2ioda/src
#   obs2ioda build:  ${work root}/obs2ioda/build
#   WPS source:      ${work root}/wps/src
#   WPS build:       ${work root}/wps/build
#
# These derived paths remain overridable through advanced environment variables
# for development and diagnostics, but they are not normal site configuration.
#
# GENERAL RULES
# -------------
#   * ${NAME} expressions are expanded from the invoking process environment.
#   * A non-empty corresponding environment variable overrides a YAML value.
#   * Empty environment variables do not mask YAML values or documented defaults.
#   * YAML booleans are written as true/false.
#   * CMake values such as ON/OFF must remain quoted so YAML does not coerce them.
#   * Paths used by PBS jobs must be visible from JACI compute nodes, normally
#     below /p or /lustre.
#   * External component refs must be tested full commit SHAs. Moving branches
#     such as main/master are intentionally rejected by configuration validation.
#   * Every user-facing key must keep explanatory comments immediately above it.
#     CI enforces this documentation contract.
#
# OPTIONAL SETTINGS NOT REPEATED IN THIS JACI FILE
# ------------------------------------------------
# The public schema also supports controlled overrides that JACI normally leaves
# at automatic/default behavior. Examples include data.local_mirror_dir,
# obs2ioda BUFR/CMake discovery settings, and WPS dependency roots/build type.
# See config/template.yaml for every public key and
# docs/configuration-reference.md for the complete reference.
#
# Typical use:
#   bash scripts/monan-jedi.sh <command> --config config/jaci.yaml
#
# Validate this file without executing the workflow:
#   python3 scripts/lib/read_config.py --check config/jaci.yaml
#   python3 scripts/check_config_documentation.py
#
# =============================================================================

# -----------------------------------------------------------------------------
# Site identity
# -----------------------------------------------------------------------------

# Human-readable identifier for the site represented by this file.
# It is metadata today; workflow behavior does not currently branch on it.
site: jaci

# -----------------------------------------------------------------------------
# User-owned workspace and shared spack-stack
# -----------------------------------------------------------------------------

project:
  # Writable MONAN-JEDI workspace root shared by login and compute nodes.
  # ${USER} is expanded from the environment of the process invoking the tool.
  root: /p/projetos/monan_das/${USER}

stack:
  # Unix account that owns the validated spack-stack instance consumed here.
  # It may intentionally differ from the user who runs the MONAN-JEDI workflow.
  owner: joao.gerd

  # Identifier of the validated spack-stack-inpe installation used on JACI.
  # Together with stack.owner it is used to derive the private stack location.
  instance: spack-stack-inpe-overlay-20260515T181917Z

  # Name of the concretized spack-stack environment below stack.root/envs/.
  # This also participates in the derived MODULEPATH used before module loading.
  env_name: jaci-mpas-jedi-gcc12-craympich

  # Site initialization script relative to the derived stack.root directory.
  # This file belongs to spack-stack; it is not the former MONAN-JEDI configs/.
  site_setup: configs/sites/tier2/jaci/setup.sh

  # Exact environment module generated by the validated JACI spack-stack.
  # Loading it selects the compiler, MPI implementation and JEDI dependencies.
  env_module: cray-mpich/8.1.31/none/none/jedi-mpas-env/1.0.0

# -----------------------------------------------------------------------------
# Build identity and compilation parallelism
# -----------------------------------------------------------------------------

build:
  # Stable identifier used to derive independent work, log and install trees.
  # Change it when a separate build/install generation is intentionally needed.
  id: monan-jedi

  # Maximum number of parallel jobs used by CMake/ecbuild compilation.
  # This is compilation parallelism; it is independent from PBS CPU requests.
  jobs: 64

# -----------------------------------------------------------------------------
# MPAS build options
# -----------------------------------------------------------------------------

model:
  # Precision mode passed to the MONAN/MPAS build as MPAS_DOUBLE_PRECISION.
  # Keep ON/OFF quoted; ON is the validation mode used with upstream CTest data.
  double_precision: 'ON'

# -----------------------------------------------------------------------------
# External data policy
# -----------------------------------------------------------------------------

data:
  # Permit network download when a required archive is absent from cache/mirror.
  # Set false only when all required external data are pre-populated locally.
  download_missing: true

# -----------------------------------------------------------------------------
# Auxiliary component: obs2ioda
# -----------------------------------------------------------------------------
#
# obs2ioda is built outside the main ecbuild bundle with the same loaded stack
# and publishes its stable executable into the common MONAN-JEDI installation.

obs2ioda:
  # Enable obs2ioda integration and include its build in the aggregate workflow.
  # Disable only when the installation intentionally does not require converters.
  enabled: true

  # Exact tested upstream revision used for reproducible obs2ioda builds.
  # The validator requires a full 40-character SHA and rejects moving branches.
  ref: 11b9e60522d63bc03b0b104a52f3dd22127fb828

# -----------------------------------------------------------------------------
# Auxiliary component: WPS / UNGRIB
# -----------------------------------------------------------------------------
#
# The integration builds the WPS tools required by this project without exposing
# WPS internal source/build/install directories as normal YAML configuration.

wps:
  # Enable the WPS/UNGRIB integration and include it in the aggregate workflow.
  # Dependency roots are normally discovered from the loaded spack-stack.
  enabled: true

  # Exact tested WPS revision. Source selection is controlled by this SHA;
  # wps.version below is a human-readable release label, not a Git selector.
  ref: 335c76a111f84503e8b963abaf273ea8053645bb

  # Human-readable WPS release label recorded in derived paths and manifests.
  # Keep this synchronized with the tested integration represented by wps.ref.
  version: 4.6.0

  # Variable table published through the stable share/wps/Vtable interface.
  # The value must be a filename present under WPS ungrib/Variable_Tables.
  default_vtable: Vtable.GFS

# -----------------------------------------------------------------------------
# Compiler and MPI wrappers
# -----------------------------------------------------------------------------

compilers:
  # C compiler command resolved after the configured stack module is loaded.
  # On JACI CrayPE, lowercase cc is the validated compiler wrapper.
  cc: cc

  # C++ compiler command resolved after stack activation.
  # On JACI CrayPE, uppercase CC is the case-sensitive C++ wrapper.
  cxx: CC

  # Canonical Fortran compiler wrapper for this site.
  # The loader also exports compatibility aliases FC, F77 and F90 from it.
  fortran: ftn

mpi:
  # MPI-aware C compiler wrapper passed to build systems where needed.
  # Under the loaded JACI environment, cc carries the required MPI integration.
  cc: cc

  # MPI-aware C++ wrapper selected by the validated JACI stack.
  # Uppercase CC remains case-sensitive and must not be changed casually.
  cxx: CC

  # Canonical MPI Fortran wrapper for this site.
  # MPIFC, MPIF77 and MPIF90 compatibility aliases are generated from it.
  fortran: ftn

# -----------------------------------------------------------------------------
# CTest selection and safety
# -----------------------------------------------------------------------------

ctest:
  # Extended regular expression passed to ctest -R for login-node validation.
  # Keep this restricted to tests known to be safe without compute-node MPI.
  login_regex: "^mpasjedi_coding_norms$"

  # Optional inclusion regex reserved for PBS-side CTest selection.
  # Empty means no additional inclusion filter beyond the PBS test workflow.
  pbs_regex: ""

  # Extended regular expression passed to ctest -E in compute-node validation.
  # These tests are excluded from the current validated complete JACI suite.
  exclude_regex: "^(ioda_bufr_python_encoder|ioda_bufr_python_parallel|mpasjedi_lgetkf_height_vloc)$"

  # Number of CTest cases allowed to execute concurrently.
  # This is test-level concurrency and is not the MPI rank count of each test.
  jobs: 1

  # Explicit safety flag for MPI tests on login nodes.
  # false preserves the project policy that login-node testing stays non-MPI.
  allow_login_node_mpi_tests: false

# -----------------------------------------------------------------------------
# PBS resources for complete compute-node validation
# -----------------------------------------------------------------------------

pbs:
  # JACI PBS queue used by the test-pbs workflow.
  # Queue policy and placement are additionally validated by repository tests.
  queue: pesqmidi

  # CPUs requested from PBS on the selected node.
  # This resource request is deliberately independent from build.jobs above.
  ncpus: 64

  # Wall-clock limit for the PBS validation job, using HH:MM:SS syntax.
  # Increase only when the validated test suite genuinely requires more time.
  walltime: "02:00:00"

  # true submits the generated PBS script immediately; false only prepares it.
  # Keep true for the maintained JACI configuration used for normal validation.
  submit_job: true
