# MONAN-JEDI — JACI build/install configuration
#
# This file contains only decisions specific to JACI. Derived directories and
# fixed implementation details are intentionally not configurable here.
#
# Filesystem contract:
#   ${project.root}/work/${build.id}   private/rebuildable work
#   ${project.root}/logs/${build.id}   logs
#   ${project.root}/build/${build.id}  public runtime installation
#
# See docs/configuration-reference.md for every supported key and its default.

site: jaci

project:
  root: /p/projetos/monan_das/${USER}

stack:
  owner: joao.gerd
  instance: spack-stack-inpe-overlay-20260515T181917Z
  env_name: jaci-mpas-jedi-gcc12-craympich

  # Relative to stack.root. This file belongs to spack-stack, not MONAN-JEDI.
  site_setup: configs/sites/tier2/jaci/setup.sh
  env_module: cray-mpich/8.1.31/none/none/jedi-mpas-env/1.0.0

build:
  id: monan-jedi
  jobs: 64

model:
  double_precision: 'ON'

data:
  download_missing: true

obs2ioda:
  enabled: true
  # Pinned commit for reproducible builds; do not use a moving branch such as main.
  ref: 11b9e60522d63bc03b0b104a52f3dd22127fb828

wps:
  enabled: true
  ref: 335c76a111f84503e8b963abaf273ea8053645bb
  version: 4.6.0
  default_vtable: Vtable.GFS

compilers:
  cc: cc
  cxx: CC
  fortran: ftn

mpi:
  cc: cc
  cxx: CC
  fortran: ftn

ctest:
  login_regex: "^mpasjedi_coding_norms$"
  pbs_regex: ""
  exclude_regex: "^(ioda_bufr_python_encoder|ioda_bufr_python_parallel|mpasjedi_lgetkf_height_vloc)$"
  jobs: 1
  allow_login_node_mpi_tests: false

pbs:
  queue: pesqmidi
  ncpus: 64
  walltime: "02:00:00"
  submit_job: true
