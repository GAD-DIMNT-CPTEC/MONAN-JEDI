# =============================================================================
# MONAN-JEDI — JACI build/install configuration
# =============================================================================
#
# PURPOSE
# -------
# This file configures how MONAN-JEDI is built, installed and validated on JACI.
# It is not an operational data-assimilation experiment configuration; cycles,
# observations, backgrounds and scientific application settings belong elsewhere.
#
# IMPORTANT FILESYSTEM MODEL
# --------------------------
# project.root/work/<build.id>  : private, rebuildable work/build trees
# project.root/logs/<build.id>  : logs
# project.root/build/<build.id> : public runtime installation
#
# The spack-stack may be owned by another account and may live outside
# project.root. Do not assume that the stack is located below project.root.
#
# MAIN DERIVED PATHS
# ------------------
#   work root:    ${project.root}/work/${build.id}
#   log root:     ${project.root}/logs/${build.id}
#   bundle build: ${project.root}/work/${build.id}/build
#   install root: ${project.root}/build/${build.id}
#   install bin:  ${install.root}/bin
#
# Downstream workflows consume ONLY the public installation. They must not use
# source checkouts, ecbuild materialization directories, or WPS build trees.
#
# Keep this value quoted applies to CMake ON/OFF settings such as
# model.double_precision so YAML does not coerce them to booleans.
# Pin external component refs to tested full commit SHAs for reproducible builds.
#
# Default public layout:
#   ${project.root}/build/${build.id}/bin
#   ${project.root}/build/${build.id}/lib
#   ${project.root}/build/${build.id}/include
#   ${project.root}/build/${build.id}/share
# =============================================================================

site: jaci

project:
  root: /p/projetos/monan_das/${USER}

stack:
  owner: joao.gerd
  instance: spack-stack-inpe-overlay-20260515T181917Z
  work_root:
  root:
  env_name: jaci-mpas-jedi-gcc12-craympich
  module_root:
  site_setup: configs/sites/tier2/jaci/setup.sh
  env_module: cray-mpich/8.1.31/none/none/jedi-mpas-env/1.0.0

build:
  id: monan-jedi
  dir:
  jobs: 64

install:
  # Empty default: ${project.root}/build/${build.id}
  root:
  # Empty default: ${install.root}/bin
  bin_dir:

model:
  # Keep this value quoted so YAML does not coerce ON/OFF.
  double_precision: 'ON'

data:
  root:
  local_root:
  download_missing: true
  crtm_coeffs_url: https://bin.ssec.wisc.edu/pub/s4/CRTM/fix_REL-3.1.2.0.tgz
  crtm_coeffs_tgz:

obs2ioda:
  enabled: true
  repo: https://github.com/NCAR/obs2ioda.git
  ref: main
  source_dir:
  build_dir:
  # Empty default: ${install.root}
  install_dir:
  executable_name: obs2ioda_v3
  bufr_root:
  bufr_lib:
  cmake_prefix_path:
  build_type: Release
  build_goes_abi_converter: 'OFF'

wps:
  enabled: true
  repo: https://github.com/wrf-model/WPS.git
  ref: 335c76a111f84503e8b963abaf273ea8053645bb
  version: 4.6.0
  source_dir:
  build_dir:

  # Versioned WPS releases are private implementation details. Empty default:
  #   ${install.root}/libexec/monan-jedi/wps
  # Public consumers use only install/bin and install/share/wps.
  releases_dir:
  install_dir:

  patch_dir:
  jasper_root:
  png_root:
  zlib_root:
  cmake_prefix_path:
  build_type: Release
  ungrib_name: ungrib.exe
  link_grib_name: link_grib.csh
  default_vtable: Vtable.GFS

compilers:
  cc: cc
  cxx: CC
  fc: ftn
  f77: ftn
  f90: ftn

mpi:
  mpicc: cc
  mpicxx: CC
  mpifc: ftn
  mpif77: ftn
  mpif90: ftn

ctest:
  login_regex: "^mpasjedi_coding_norms$"
  pbs_regex: ""
  exclude_regex: "^(ioda_bufr_python_encoder|ioda_bufr_python_parallel|mpasjedi_lgetkf_height_vloc)$"
  jobs: 1
  allow_login_node_mpi_tests: false

pbs:
  queue: pesqmidi
  ncpus: 64
  walltime: "02:00:00"
  submit_job: true
