# =============================================================================
# MONAN-JEDI site configuration for JACI
# =============================================================================
#
# PURPOSE
# -------
# This is the maintained JACI configuration used to prepare, build, install and
# validate MONAN-JEDI. It contains only values that are important to make
# explicit for JACI; all other supported options use the documented defaults.
#
# The complete list of user-configurable options lives in config/template.yaml.
# A user may copy that template or add any supported key here when an override
# is needed. Empty optional values mean "derive the documented default".
#
# IMPORTANT FILESYSTEM MODEL
# --------------------------
# project.root is the user-owned workspace. The validated spack-stack may be
# shared and owned by another account. The stack therefore remains independent
# from the user's MONAN-JEDI work/install area.
#
# MAIN DERIVED PATHS
# ------------------
# Unless overridden through a supported YAML option or environment variable:
#
#   project work:    ${project.root}/work/${build.id}
#   logs:            ${project.root}/logs/${build.id}
#   bundle build:    ${project work}/build
#   data cache:      ${project work}/cache/data
#   install root:    ${project.root}/build/${build.id}
#   install bin:     ${install.root}/bin
#   obs2ioda source: ${project work}/obs2ioda/src
#   WPS source:      ${project work}/wps/src
#
# GENERAL RULES
# -------------
#   * config/template.yaml documents every public option, including path, URL,
#     repository and auxiliary-component overrides intentionally omitted here.
#   * Empty optional values use their documented defaults or derived paths.
#   * Non-empty environment variables override YAML values for one-off changes.
#   * ON/OFF CMake strings remain quoted; YAML booleans use true/false.
#   * External source revisions remain pinned to tested full commit SHAs.
#   * CI verifies both configuration behavior and documentation completeness.
#
# Validate this file without executing the build:
#   python3 scripts/lib/read_config.py --check config/jaci.yaml
#   python3 scripts/check_config_documentation.py
#
# =============================================================================

# -----------------------------------------------------------------------------
# Site and user workspace
# -----------------------------------------------------------------------------

# Human-readable identifier for this maintained configuration.
# It records which site the explicit settings below describe.
site: jaci

project:
  # Writable MONAN-JEDI workspace visible from JACI login and compute nodes.
  # Derived work, logs, caches and installation paths start from this root.
  root: /p/projetos/monan_das/${USER}

# -----------------------------------------------------------------------------
# Validated shared spack-stack
# -----------------------------------------------------------------------------

stack:
  # Unix account that owns the validated shared spack-stack installation.
  # It may intentionally differ from the user executing MONAN-JEDI.
  owner: joao.gerd

  # Identifier of the validated spack-stack-inpe installation used on JACI.
  # Default stack paths are derived from this value and stack.owner.
  instance: spack-stack-inpe-overlay-20260515T181917Z

  # Name of the concretized JACI environment below the selected spack-stack.
  # It determines the module tree used before loading the JEDI environment.
  env_name: jaci-mpas-jedi-gcc12-craympich

  # JACI site initialization script interpreted relative to stack.root.
  # This belongs to spack-stack and is unrelated to this repository's config/.
  site_setup: configs/sites/tier2/jaci/setup.sh

  # Exact environment module generated by the validated JACI spack-stack.
  # It selects the compiler, MPI implementation and JEDI dependencies.
  env_module: cray-mpich/8.1.31/none/none/jedi-mpas-env/1.0.0

# -----------------------------------------------------------------------------
# Build and model choices worth keeping explicit on JACI
# -----------------------------------------------------------------------------

build:
  # Stable build/install generation name used by the derived filesystem layout.
  # Keep it explicit because changing it creates an independent installation.
  id: monan-jedi

  # Parallel compilation jobs used by the main bundle and auxiliary builds.
  # This is build concurrency and is independent from the PBS CPU request.
  jobs: 64

model:
  # MPAS precision mode used for the maintained validation build on JACI.
  # Keep ON/OFF quoted; ON matches the double-precision upstream test references.
  double_precision: 'ON'

data:
  # Permit download of required external archives when cache/mirror lookup fails.
  # JACI normally has network access, so the maintained configuration allows it.
  download_missing: true

# -----------------------------------------------------------------------------
# Auxiliary components enabled by the maintained JACI installation
# -----------------------------------------------------------------------------

obs2ioda:
  # Include obs2ioda in the maintained MONAN-JEDI installation and aggregate build.
  # Repository URL, paths and build details use documented template defaults.
  enabled: true

  # Exact tested source revision for reproducible JACI builds.
  # Keeping this explicit makes the validated upstream revision visible in-site.
  ref: 11b9e60522d63bc03b0b104a52f3dd22127fb828

wps:
  # Include the supported WPS/UNGRIB tools in the maintained JACI installation.
  # Repository, directories, dependency roots and published names use defaults.
  enabled: true

  # Exact tested WPS revision against which the local compatibility patches apply.
  # The human-readable version and other WPS settings use template defaults.
  ref: 335c76a111f84503e8b963abaf273ea8053645bb

# -----------------------------------------------------------------------------
# JACI compiler and MPI wrappers
# -----------------------------------------------------------------------------

compilers:
  # JACI CrayPE C compiler wrapper after the configured stack module is loaded.
  # This site-specific command is intentionally explicit rather than implicit.
  cc: cc

  # JACI CrayPE C++ wrapper; uppercase CC is case-sensitive on this platform.
  # Keep this explicit so a generic-site default cannot silently replace it.
  cxx: CC

  # Canonical JACI Fortran compiler wrapper from the loaded Cray environment.
  # FC/F77/F90 compatibility aliases are generated automatically from this value.
  fortran: ftn

mpi:
  # MPI-aware C wrapper exposed by the loaded JACI Cray environment.
  # JACI uses cc rather than a separate mpicc command in this stack.
  cc: cc

  # MPI-aware C++ wrapper exposed by the loaded JACI Cray environment.
  # Uppercase CC remains significant and is therefore explicit here.
  cxx: CC

  # Canonical MPI Fortran wrapper used on JACI after stack activation.
  # MPIFC/MPIF77/MPIF90 aliases are generated automatically from this value.
  fortran: ftn

# -----------------------------------------------------------------------------
# Test selections and PBS resources that encode JACI operating policy
# -----------------------------------------------------------------------------

ctest:
  # Tests currently excluded from the complete JACI compute-node validation.
  # The login-node inclusion regex and CTest concurrency use schema defaults.
  exclude_regex: "^(ioda_bufr_python_encoder|ioda_bufr_python_parallel|mpasjedi_lgetkf_height_vloc)$"

pbs:
  # JACI queue used by the compute-node validation workflow.
  # Keep the queue visible because it is an operational site policy choice.
  queue: pesqmidi

  # CPUs requested from one JACI node for the complete validation suite.
  # This scheduler resource is independent from build.jobs above.
  ncpus: 64

  # Wall-clock limit requested for the maintained JACI validation job.
  # The value uses PBS HH:MM:SS syntax and may be adjusted from operating history.
  walltime: "02:00:00"

  # Submit the generated validation job automatically in the maintained JACI flow.
  # Generic templates default to false so new sites do not submit accidentally.
  submit_job: true
