name: Shell checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install configuration dependency
        run: python -m pip install PyYAML
      - name: Check shell syntax
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Check YAML readers
        run: |
          python scripts/lib/read_config.py config/jaci.yaml >/dev/null
          python - <<'PY'
          import yaml
          with open('config/wps-jaci.yaml.example', encoding='utf-8') as stream:
              assert isinstance(yaml.safe_load(stream), dict)
          PY
