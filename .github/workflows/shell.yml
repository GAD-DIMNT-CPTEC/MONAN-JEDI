name: Workflow checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  syntax-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Check shell syntax and style
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

          bash -n tests/test_wps_dependency_resolution.sh
          bash -n tests/test_unbalance_build_contract.sh
          bash -n tests/test_pbs_placement_policy.sh
          bash -n tests/test_pbs_result.sh
          bash -n tests/test_stack_environment.sh

          shellcheck --severity=error -e SC1090,SC1091 \
            scripts/monan-jedi.sh scripts/monan-jedi-wps.sh scripts/lib/*.sh \
            tests/test_wps_dependency_resolution.sh \
            tests/test_unbalance_build_contract.sh \
            tests/test_pbs_placement_policy.sh \
            tests/test_pbs_result.sh \
            tests/test_stack_environment.sh

          bash tests/test_wps_dependency_resolution.sh
          bash tests/test_unbalance_build_contract.sh
          bash tests/test_pbs_placement_policy.sh
          bash tests/test_pbs_result.sh
          bash tests/test_stack_environment.sh
      - name: Check Python
        run: |
          python -m py_compile scripts/lib/read_config.py tests/test_config.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate unbalance patches against pinned sources
        run: |
          git clone --filter=blob:none https://github.com/jcsda/saber.git saber
          git -C saber checkout --detach d05c06fcc7da97389a19594a2e5424e709648330
          git clone --filter=blob:none https://github.com/jcsda/mpas-jedi.git mpas-jedi
          git -C mpas-jedi checkout --detach 19eb7fb3273c7b3094825201af184834c15afdd0
          bash scripts/apply_unbalance_ensemble_patches.sh
          bash scripts/apply_unbalance_ensemble_patches.sh
      - name: Validate WPS patches against pinned source
        run: |
          git clone --filter=blob:none https://github.com/wrf-model/WPS.git /tmp/WPS
          git -C /tmp/WPS checkout --detach 335c76a111f84503e8b963abaf273ea8053645bb
          for patch in patches/wps/*.patch; do
            git -C /tmp/WPS apply --check "${GITHUB_WORKSPACE}/${patch}"
            git -C /tmp/WPS apply "${GITHUB_WORKSPACE}/${patch}"
          done
